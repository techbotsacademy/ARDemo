<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Feet Automatic Drone Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #090d16;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        p { color: #94a3b8; margin-bottom: 25px; }
        
        .status-display {
            background: #020617;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 25px;
            min-height: 25px;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .start-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 20px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
            transition: all 0.2s ease;
        }
        
        .stop-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            background: #475569 !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎓 2-Feet Drone Demo</h1>
    <p>Automatic Takeoff, Hover & Soft Landing</p>

    <div id="status" class="status-display">STATUS: IDLE</div>

    <div class="btn-group">
        <button id="startBtn" class="start-btn" onclick="startDemo()">🚀 START 2-FEET DEMO</button>
        <button id="stopBtn" class="stop-btn" onclick="emergencyStop()">🛑 EMERGENCY STOP</button>
    </div>
</div>

<script>
    async function startDemo() {
        document.getElementById('startBtn').disabled = true;
        try {
            await fetch('/start-demo', { method: 'POST' });
        } catch(e) {}
    }

    async function emergencyStop() {
        try {
            await fetch('/emergency-stop', { method: 'POST' });
        } catch(e) {}
    }

    // Status sync with backend
    setInterval(async () => {
        try {
            const res = await fetch('/status');
            const data = await res.json();
            
            document.getElementById('status').innerText = data.state;
            
            if (data.isRunning) {
                document.getElementById('startBtn').disabled = true;
            } else {
                document.getElementById('startBtn').disabled = false;
            }
        } catch(e) {}
    }, 200);
</script>

</body>
</html>
